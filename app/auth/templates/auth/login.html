{% extends "base.html" %}

{% block title %}Iniciar sesión — AppEnzo{% endblock %}

{% block content %}
  <div class="card" style="max-width: 420px; margin: 48px auto;">
    <h1>AppEnzo</h1>
    <p class="muted" style="margin-top: 0;">Iniciar sesión</p>
    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}
    <form method="post">
      <label>
        Email
        <input type="text" name="email" required autofocus />
      </label>
      <label>
        Contraseña
        <input type="password" name="password" required />
      </label>
      <button type="submit">Entrar</button>
    </form>
  </div>
{% endblock %}
