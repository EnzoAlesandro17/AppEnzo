{% extends "base.html" %}

{% block title %}Nueva tarjeta — AppEnzo{% endblock %}

{% block breadcrumbs %}
  <a href="{{ url_for('main.index') }}">AppEnzo</a>
  <span class="sep">/</span>
  <a href="{{ url_for('cards.list_cards') }}">Tarjetas</a>
  <span class="sep">/</span>
  <span class="current">Nueva tarjeta</span>
{% endblock %}

{% block content %}
  <h1>Nueva tarjeta</h1>
  <div class="card">
    <form method="post">
      <label>
        Nombre
        <input type="text" name="name" required autofocus />
      </label>
      <label>
        Banco
        <input type="text" name="bank" />
      </label>
      <label>
        Últimos 4 dígitos
        <input type="text" name="last_four_digits" maxlength="4" pattern="[0-9]{4}" />
      </label>
      <button type="submit">Crear</button>
    </form>
  </div>
{% endblock %}
